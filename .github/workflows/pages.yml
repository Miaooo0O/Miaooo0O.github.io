name: Publish blog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Read public site address
        id: pages
        uses: actions/configure-pages@v5
      - name: Build blog
        env:
          BLOG_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node -e "require('fs').writeFileSync('_config.pages.yml', 'url: ' + JSON.stringify(process.env.BLOG_URL) + '\n')"
          pnpm exec hexo generate --config _config.yml,_config.pages.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
